replicaCount: 1

# Workload type: "deployment" or "statefulset"
workloadType: deployment

# StatefulSet specific configuration (only used when workloadType is "statefulset")
statefulset:
  # Service name for StatefulSet (required for StatefulSet)
  serviceName: nullplatform-agent
  # Pod Management Policy: "OrderedReady" or "Parallel"
  podManagementPolicy: OrderedReady
  # Update strategy
  updateStrategy:
    type: RollingUpdate
  # Persistent Volume Claims for StatefulSet
  # volumeClaimTemplates: []
  # Example:
  # volumeClaimTemplates:
  #   - metadata:
  #       name: data
  #     spec:
  #       accessModes: [ "ReadWriteOnce" ]
  #       storageClassName: "standard"
  #       resources:
  #         requests:
  #           storage: 1Gi
  volumeClaimTemplates: []

namespace: nullplatform-tools

args:
  - "--tags=$(TAGS)"
  - "--apikey=$(NP_API_KEY)"
  - "--runtime=host"
  - "--command-executor-env=NP_API_KEY=$(NP_API_KEY)"
  - "--command-executor-debug"
  - "--webserver-enabled"
  - "--command-executor-git-command-repos $(AGENT_REPO)"

configuration:
  create: true
  secretName: nullplatform-agent-secret
  values:
    TAGS: "gato:negro"
    NP_LOG_LEVEL: DEBUG
    NP_API_KEY: ""
      # example:
    # AGENT_REPO: "https://reppo_01.gt#main,https://token@repo_01.git#main"
    AGENT_REPO: ""

image:
  repository: public.ecr.aws/nullplatform/controlplane-agent
  pullPolicy: Always
  tag: latest

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: nullplatform-agent
  # Set to true for cluster-wide access (ClusterRole), false for namespace-scoped access (Role)
  clusterWide: true
  role:
    rules:
      - apiGroups:
          - '*'
          - ""
        resources:
          - '*'
        verbs:
          - '*'

podAnnotations:
  name: nullplatform-agent
podLabels:
  name: nullplatform-agent

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}

livenessProbe:
  httpGet:
    path: /health
    port: 8080
readinessProbe:
  httpGet:
    path: /health
    port: 8080

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations:
  - key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 300
  - key: "node.kubernetes.io/unreachable"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 300

affinity: {}

priorityClass:
  enabled: true
  value: 500000

# Init containers to run before the main container
# Example:
# initContainers:
#   - name: install-dependencies
#     image: busybox:1.36
#     command: ['sh', '-c', 'echo "Installing dependencies..."']
#     volumeMounts:
#       - name: repos
#         mountPath: /root/.np
initContainers: []

# ── GitHub App authentication for command repos ──────────────────────────────
# Command repos normally carry their credential inside the URL
# (https://<token>@github.com/org/repo.git). That token is static: when it
# expires, clones and pulls fail until the agent is restarted. With githubApps
# the agent mints short-lived installation tokens itself and renews them before
# they expire.
#
# Credentials are configured PER ORGANIZATION — each org has its own App ID and
# its own private key, so a key can only ever mint tokens for the orgs it was
# explicitly bound to. There is no global App: an org that is not listed here
# keeps using whatever credential its repo URL carries, and the agent logs a
# warning naming it.
#
# Rendered as the NP_GITHUB_APPS env var, because the agent's --github-app flag
# is repeatable and Kubernetes can only substitute $(VAR) inside a single
# argument value.
#
# A private key is NEVER a chart parameter. The chart never receives, templates
# or creates PEM material: it only references it. There are exactly two sources,
# and both can be mixed across orgs:
#
#   1. A Secret that already exists in the cluster (`secret.name` +
#      `apps[].privateKeySecretKey`), created out of band — external-secrets,
#      Vault, SOPS, or by hand. The chart mounts it read-only.
#   2. An AWS SSM SecureString parameter (`apps[].privateKeySsmParameter`), read
#      by the agent at boot. Nothing is stored in the cluster at all.
githubApps:
  # -- Enable per-org GitHub App auth for command repos.
  enabled: false
  secret:
    # -- Name of an EXISTING Secret in the cluster holding one PEM per org, one
    # key per org (see `apps[].privateKeySecretKey`). The chart only mounts it;
    # it never creates it, so the key material never passes through Helm values.
    # Required when at least one org reads its key from a file rather than SSM.
    name: ""
  # -- Read-only mount point for the PEM files inside the agent container.
  mountPath: /etc/nullplatform/github-apps
  # -- One entry per GitHub organization. Each needs `org` and `appId`, plus
  # exactly one key source: `privateKeySecretKey` (a key inside
  # `githubApps.secret.name`) or `privateKeySsmParameter` (an AWS SSM
  # SecureString, needs IRSA on the serviceAccount). `installationId` is
  # optional: when set the agent skips the installation lookup; when omitted it
  # resolves the installation from the org.
  apps: []
  #  - org: acme-core
  #    appId: "123456"
  #    installationId: "78901234"
  #    privateKeySecretKey: acme-core.pem   # defaults to "<org>.pem"
  #  - org: acme-labs
  #    appId: "654321"
  #    privateKeySsmParameter: /np/gh/acme-labs-key

# -- DEPRECATED: superseded by `githubApps`, which the agent implements natively
# (per-org installation tokens, renewed before they expire). This init container
# mints a single token with openssl/jq and clones once, so the token is never
# refreshed and only one installationId is supported. Still functional; it will
# be removed in a future major version.
githubTokenInit:
  enabled: false
  image: alpine:3.22.2
  # Secret that contains GitHub App configuration
  secretName: "github-app-secret"
  # Keys in the secret for each value
  secretKeys:
    appId: "APP_ID"           # nombre de la clave en el secret
    installationId: "INSTALLATION_ID"
    privateKey: "PRIVATE_KEY"
  values:
    appId: ""
    installationId: ""
    privateKey: ""
  # Directory where the repository will be cloned (shared with main container)
  cloneDir: "nullplatform"
  repositoryUrl: ""
  workingDir: "/root/.np"

volumes: []

initScripts: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

# Lifecycle preStop Hook for Graceful Agent Shutdown
lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - 'pid=$(pgrep -f agent) && kill -15 $pid && sleep 30'

# Image pull secret configuration
imagePullSecret:
  # Use an existing secret (recommended for production)
  # Set 'name' to reference an existing secret, leave create: false
  # OR
  # Create a new secret by setting create: true and providing credentials
  create: false
  # name: image-pull-secret-agent
  # registry: ""
  # username: ""
  # password: ""

# ── Worker orchestration ─────────────────────────────────────────────────────
# The agent spawns package workers (lean gRPC servers) and streams actions to
# them over gRPC — no separate controller.
#
# Priority when a package-exec arrives:
#   pins (an exact worker you control, trusted)  >  rules (config for a matched
#   class)  >  defaults (every worker).  allowedRegistries gates every image that
#   is resolved DYNAMICALLY (i.e. not from a pin) — deny-by-default.
worker:
  # backend: kubernetes (agent creates Deployment+Service per package) |
  #          docker (agent runs host containers)
  backend: kubernetes
  # security between the agent and its workers:
  #   insecure – plaintext, no auth (default). Fine when the network path is
  #              already isolated (a private cluster, a mesh, or the opt-in
  #              NetworkPolicy below).
  #   mtls     – agent mints a per-process CA, hands each worker a cert, and dials
  #              with a client cert (only the agent can call the worker, encrypted).
  #              No external CA / cert-manager / service mesh. Opt in for it.
  security: insecure
  # Opt-in NetworkPolicy so ONLY the agent may reach worker pods (needs a CNI that
  # enforces it — Calico/Cilium/EKS/GKE/AKS). Off by default; turn it on for
  # network-level isolation (esp. with security: insecure). k8s backend only.
  networkPolicy:
    create: false
  # namespace workers are created in (empty = the agent's namespace)
  namespace: ""
  # gRPC port every worker listens on (NP_GRPC_LISTEN)
  grpcPort: 50051

  # ── allowedRegistries — the guardrail (rendered as NP_ALLOWED_REGISTRIES) ──
  # Deny-by-default: a worker whose image is resolved DYNAMICALLY from the action
  # (not pinned below) only spawns when its image matches one of these globs.
  # '*' matches any characters, including '/'. An empty list means nothing
  # dynamic runs (only pins do) — set this, or every package-exec is refused.
  allowedRegistries: []
    # - "ghcr.io/your-org/*"
    # - "*.dkr.ecr.us-east-1.amazonaws.com/your-org/*"

  # ── patches — the standard way to shape workers (rendered as NP_WORKER_PATCHES) ──
  # Preferred over `defaults`/`rules` below. Each entry patches ONLY the workers
  # whose package/version matches `target` (glob; an empty/omitted target matches
  # EVERY worker — that's the base, replacing `defaults`). The patch itself is
  # standard Kubernetes patching of the worker Pod — no bespoke language:
  #   merge: <partial Pod>        strategic-merge, like `kubectl patch --type=merge`
  #   json:  [{op,path,value}]    RFC-6902,      like `kubectl patch --type=json`
  # The kubernetes backend applies the patch to the Pod; the docker backend takes
  # the subset it can honor (the `worker` container's image/command/env/resources)
  # and ignores pod-only fields (serviceAccountName, nodeSelector, …).
  patches: []
    # - target: { package: "scopes-lambda" }        # optional: version: "0.0.2"
    #   merge:
    #     spec:
    #       serviceAccountName: np-agent-sa
    #       containers:
    #         - name: worker
    #           resources: { limits: { memory: "2Gi" } }
    #           env:
    #             - { name: ASSUME_ROLE_ARN_DEFAULT, value: "arn:aws:iam::123:role/lambda" }
    # - target: {}                                    # every worker (the base)
    #   json:
    #     - { op: add, path: "/metadata/labels/team", value: "platform" }

  # ── idleTTL — reap idle workers (rendered as NP_WORKER_IDLE_TTL) ──
  # A worker idle this long is deleted: 0 in-flight, dynamic (a pin is NEVER
  # reaped), past one TTL of its own life, and not labelled
  # nullplatform.com/keep-alive. Empty = disabled (workers live until the agent or
  # their namespace is torn down). Go duration, e.g. "30m", "2h".
  idleTTL: ""

  # ── defaults — base config for EVERY worker (LEGACY — prefer `patches` above) ──
  defaults:
    serviceAccount: ""      # default SA for worker pods (empty = namespace default)
    nodeSelector: {}
    labels: {}
    imagePullSecrets: []    # names of existing pull secrets
    env: {}                 # extra env for every worker (NP_API_KEY + the cluster
                            # CA trust are handled by the agent automatically)
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

  # ── rules — config for a matched CLASS of dynamic workers (LEGACY — prefer `patches`) ──
  # First match wins. `match` globs the image registry/repository, the package
  # slug, and/or the version; an empty field is a wildcard and an empty match is
  # a catch-all. A rule supplies pod config only — the image stays dynamic.
  rules: []
    # - match: { registry: "*.dkr.ecr.us-east-1.amazonaws.com/*" }
    #   imagePullSecrets: [ecr-pull]
    # - match: { package: "heavy-*" }
    #   resources: { limits: { memory: "2Gi" } }

  # ── pins — EXACT workers you control (rendered as NP_WORKERS) ──
  # Highest priority, and a pin's image is TRUSTED (bypasses allowedRegistries).
  # Matched by exact (package, version), else the package's no-version pin. Each
  # pin may carry its own per-worker overrides (own serviceAccount/RBAC, resources,
  # env, namespace, …); anything omitted inherits `defaults`.
  pins: []
    # - package: my-scope
    #   version: "0.0.7"
    #   image: ghcr.io/org/my-scope:0.0.7
    #   serviceAccount: my-scope-sa
    # - package: heavy-scope
    #   version: "1.2.0"
    #   image: ghcr.io/org/heavy:1.2.0
    #   resources: { limits: { memory: "1Gi" } }

  # RBAC letting the agent manage worker Deployments/Services/Pods/Secrets in
  # `namespace`. Enable when you scope the agent's own RBAC down from cluster-wide.
  rbac:
    create: false
